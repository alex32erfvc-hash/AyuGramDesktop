name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  windows:
    name: Windows x64 Release Build
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free runner disk space & configure pagefile
        shell: pwsh
        run: |
          Write-Host "Initial disk space:"
          Get-PSDrive C | Select-Object Used, Free
          $paths = @(
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\stack",
            "C:\Program Files\Android",
            "C:\Program Files\MySQL",
            "C:\Program Files\MongoDB",
            "C:\Program Files\PostgreSQL",
            "C:\ghcup",
            "C:\cabal",
            "C:\Strawberry",
            "C:\Program Files\Amazon",
            "C:\Program Files\Microsoft SDKs\Azure",
            "C:\Program Files\LLVM",
            "C:\Program Files (x86)\LLVM",
            "C:\ProgramData\chocolatey",
            "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Fast removing $p via cmd rd..."
              cmd.exe /c "rd /s /q `"$p`"" 2>$null
            }
          }
          if (Test-Path 'C:\Program Files\dotnet\sdk') {
            Get-ChildItem 'C:\Program Files\dotnet\sdk' | Where-Object { $_.Name -notlike '9.*' -and $_.Name -notlike '8.*' } | ForEach-Object { cmd.exe /c "rd /s /q `"$($_.FullName)`"" 2>$null }
          }
          Remove-Item -Recurse -Force "$env:TEMP\*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force 'C:\Windows\Temp\*' -ErrorAction SilentlyContinue

          Write-Host "Configuring 32 GB Windows Virtual Memory (Pagefile)..."
          try {
            Set-CimInstance -Query "Select * from Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $False} -ErrorAction SilentlyContinue
            $pf = Get-CimInstance Win32_PageFileSetting
            if ($pf) {
              $pf | Set-CimInstance -Property @{InitialSize = 16384; MaximumSize = 32768} -ErrorAction SilentlyContinue
            } else {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = "C:\pagefile.sys"; InitialSize = 16384; MaximumSize = 32768} -ErrorAction SilentlyContinue
            }
            Get-CimInstance Win32_PageFileSetting | Select-Object Name, InitialSize, MaximumSize
          } catch {
            Write-Host "Pagefile setting note: $_"
          }

          $vsInstaller = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          if (Test-Path $vsInstaller) {
            Write-Host "Adding $vsInstaller to GITHUB_PATH"
            $vsInstaller | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Write-Host "Disk space after cleanup:"
          Get-PSDrive C | Select-Object Used, Free

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Submodules
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME
          git submodule update --init --depth=1

      - name: First set up
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "alex32erfvc@example.com"
          git config --global user.name "alex32erfvc"

      - name: Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            Write-Host "Visual Studio Installer not found at $installer"
            exit 0
          }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -property installationPath)[0]
          if (-not $path) {
            Write-Host "No Visual Studio instance found."
            exit 0
          }

          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if ($toolset) {
            $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
            if (Test-Path $header) {
              Write-Host "ATL is already installed for $($toolset.Name)."
              exit 0
            }
          }

          Write-Host "Attempting to install ATL component..."
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify',
            '--installPath', "`"$path`"",
            '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache'
          )
          Write-Host "Installer finished with code $($process.ExitCode)."

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2rel-

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qtrel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qtrel-

      - name: Build Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Generate stub DesktopPrivate
        shell: bash
        run: |
          mkdir -p $TBUILD/DesktopPrivate
          random_key() {
            printf -- '-----BEGIN RSA PRIVATE KEY-----\n%s\n-----END RSA PRIVATE KEY-----\n'               "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n'             "$(random_key)" "$(random_key)" > $TBUILD/DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "%s";\n'             "$(random_key)" > $TBUILD/DesktopPrivate/alpha_private.h

      - name: Free up disk space
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          find $LibrariesPath -name '*.pdb' -delete 2>/dev/null || true
          rm -rf $TBUILD/ThirdParty/*.exe $TBUILD/ThirdParty/*.zip $TBUILD/ThirdParty/*.7z $TBUILD/ThirdParty/*.tar.* $TBUILD/ThirdParty/*.msi 2>/dev/null || true

      - name: Save ThirdParty cache
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Build AyuGram Desktop
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_SPECIAL_TARGET=win64 ^
          -D DESKTOP_APP_ENABLE_LTO=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT="" ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release -- /m:2 /p:TrackFileAccess=false || cmake --build ..\out --config Release -- /m:1

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          $searchDir = "$env:TBUILD\$env:REPO_NAME\out"
          Write-Host "Searching for built executable in $searchDir..."
          $exe = Get-ChildItem -Path $searchDir -Filter "AyuGram.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $searchDir -Filter "Telegram.exe" -Recurse -File | Select-Object -First 1
          }
          if ($exe) {
            Write-Host "Found binary: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
            Copy-Item $exe.FullName "artifact\AyuGram_2.exe"
            Write-Host "Successfully prepared artifact\AyuGram_2.exe"
          } else {
            Write-Error "Neither AyuGram.exe nor Telegram.exe was found in $searchDir!"
            exit 1
          }
          Get-ChildItem artifact

      - name: Upload AyuGram Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-SpeedBoost-Win64
          path: artifact\AyuGram_2.exe
          retention-days: 14
